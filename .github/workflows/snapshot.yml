name: snapshot

# TEST BRANCH ONLY (feat/ue-extended): this copy builds just the UE-Extended add-on and publishes it to
# the separate `test-ue-extended` prerelease, so a dispatch with --ref feat/ue-extended never touches the
# `snapshot`, `test-dlssg` or `test-dawnwalker` releases or Pages. main keeps its own snapshot.yml.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build (x64, ue-extended add-on only)
        run: cmake --build --preset clang-x64-release --target ue-extended --verbose

      - name: Prepare Release folder
        run: |
          md githubrelease
          copy build\release\renodx-ue-extended.* githubrelease\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: renodx-ue-extended-test-addon
          path: githubrelease

      - name: Publish test prerelease
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: test-ue-extended
          prerelease: true
          title: RenoDX test build (UE-Extended + host API v4, feat/ue-extended)
          files: githubrelease/*
